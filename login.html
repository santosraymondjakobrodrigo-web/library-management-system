<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive LMS - MongoDB Cloud Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    </style>
</head>
<body class="h-full font-sans text-zinc-900 antialiased flex items-center justify-center p-4 selection:bg-white selection:text-zinc-950">

    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
        
        <!-- Header Branding -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-white text-zinc-950 shadow-md mb-2">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">ARCHIVE LMS</h1>
            <p class="text-xs text-zinc-400">MongoDB Cloud Access Terminal</p>
        </div>

        <!-- Mode Toggle Switcher -->
        <div class="grid grid-cols-2 gap-1 bg-zinc-950/80 p-1 rounded-xl border border-zinc-800/80 text-xs font-medium">
            <button id="tab-login" onclick="switchAuthMode('login')" class="py-2 rounded-lg bg-zinc-800 text-white transition-all">Sign In</button>
            <button id="tab-register" onclick="switchAuthMode('register')" class="py-2 rounded-lg text-zinc-400 hover:text-white transition-all">Create Account</button>
        </div>

        <!-- Alert Banner -->
        <div id="alert-box" class="hidden p-3 rounded-xl border text-xs font-medium"></div>

        <!-- LOGIN FORM -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-zinc-400 font-medium mb-1.5">Email Address</label>
                <input type="email" id="login-email" required placeholder="admin@archive.org" class="w-full px-3.5 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-200 placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-white">
            </div>
            <div>
                <label class="block text-zinc-400 font-medium mb-1.5">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-200 placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-white">
            </div>
            <button type="submit" class="w-full py-2.5 bg-white hover:bg-zinc-200 text-zinc-950 font-semibold rounded-xl transition-all shadow-md mt-2">Sign In to Dashboard</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 text-xs hidden">
            <div>
                <label class="block text-zinc-400 font-medium mb-1.5">Full Name</label>
                <input type="text" id="reg-name" required placeholder="Juan Dela Cruz" class="w-full px-3.5 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-200 placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-white">
            </div>
            <div>
                <label class="block text-zinc-400 font-medium mb-1.5">Role / Designation</label>
                <select id="reg-role" class="w-full px-3.5 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-200 focus:outline-none focus:ring-1 focus:ring-white">
                    <option value="Librarian">Librarian</option>
                    <option value="System Admin">System Admin</option>
                    <option value="Assistant Staff">Assistant Staff</option>
                </select>
            </div>
            <div>
                <label class="block text-zinc-400 font-medium mb-1.5">Email Address</label>
                <input type="email" id="reg-email" required placeholder="juan@archive.org" class="w-full px-3.5 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-200 placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-white">
            </div>
            <div>
                <label class="block text-zinc-400 font-medium mb-1.5">Password</label>
                <input type="password" id="reg-password" required placeholder="At least 6 characters" minlength="6" class="w-full px-3.5 py-2.5 bg-zinc-950 border border-zinc-800 rounded-xl text-zinc-200 placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-white">
            </div>
            <button type="submit" class="w-full py-2.5 bg-white hover:bg-zinc-200 text-zinc-950 font-semibold rounded-xl transition-all shadow-md mt-2">Register Account to Cloud</button>
        </form>

        <div class="pt-2 border-t border-zinc-800/80 text-center">
            <p class="text-[11px] text-zinc-500 font-mono">Archive LMS MongoDB Cloud Protocol v3.0</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Redirect kung naka-login na
            if (localStorage.getItem('lms_session')) {
                window.location.href = 'lms.html';
            }
        };

        function switchAuthMode(mode) {
            hideAlert();
            const loginForm = document.getElementById('form-login');
            const registerForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = "py-2 rounded-lg bg-zinc-800 text-white transition-all";
                tabRegister.className = "py-2 rounded-lg text-zinc-400 hover:text-white transition-all";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabLogin.className = "py-2 rounded-lg text-zinc-400 hover:text-white transition-all";
                tabRegister.className = "py-2 rounded-lg bg-zinc-800 text-white transition-all";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
const response = await fetch('https://library-management-system-op5l.onrender.com/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
});

                const data = await response.json();


if (response.ok && data.user) {
    localStorage.setItem('lms_session', JSON.stringify(data.user));
    showAlert('Login successful! Redirecting...', 'success');

    setTimeout(() => {
        window.location.href = 'lms.html';
    }, 800);
} else {
    showAlert(data.message || 'Login failed. Please check your credentials.', 'error');
}

                } else {
                    showAlert(data.error || 'Invalid email address or password.', 'error');
                }
            } catch (err) {
                console.error("Login error:", err);
                showAlert('Hindi makakonekta sa server/database.', 'error');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const role = document.getElementById('reg-role').value;
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            try {
const response = await fetch('https://library-management-system-op5l.onrender.com/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, role, email, password })
});

                const data = await response.json();

                if (response.ok) {
                    showAlert('Account created in Cloud! You can now sign in.', 'success');
                    setTimeout(() => {
                        switchAuthMode('login');
                        document.getElementById('login-email').value = email;
                        document.getElementById('login-password').value = '';
                    }, 1000);
                } else {
                    showAlert(data.error || 'Failed to register account.', 'error');
                }
            } catch (err) {
                console.error("Register error:", err);
                showAlert('Hindi makakonekta sa server/database.', 'error');
            }
        }

        function showAlert(message, type) {
            const box = document.getElementById('alert-box');
            box.innerText = message;
            box.classList.remove('hidden', 'bg-red-950/50', 'border-red-800', 'text-red-400', 'bg-emerald-950/50', 'border-emerald-800', 'text-emerald-400');
            
            if (type === 'error') {
                box.classList.add('bg-red-950/50', 'border-red-800', 'text-red-400');
            } else {
                box.classList.add('bg-emerald-950/50', 'border-emerald-800', 'text-emerald-400');
            }
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }
    </script>
</body>
</html>
